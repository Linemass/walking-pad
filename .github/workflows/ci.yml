name: checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  engine-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install aiohttp playwright && python -m playwright install --with-deps chromium
      - name: Compile every Python file
        run: python -m compileall -q engine.py pad_control.py community_client.py design tests
      - name: Engine rules
        run: python -P design/test_engine.py
      - name: UI JavaScript parses
        run: node -e "new Function(require('fs').readFileSync('web/ui.js','utf8')); const h=require('fs').readFileSync('web/index.html','utf8'); new Function(h.split('<script>')[1].split('</script>')[0])"
      - name: UI layout check (light + dark, desktop + phone)
        run: python -P design/make_fixture.py && python -P design/overlap_check.py

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: community
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install (pinned wrangler)
        run: npm ci
      - name: Worker API tests (local wrangler + D1)
        shell: bash
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee test.log; then
            # public annotation with the end of the log (job logs need a GitHub login to read)
            msg=$(grep -E "not ok|Error|error|assert|expected|actual|✖" test.log | tail -25 | sed ':a;N;$!ba;s/
/%0A/g')
            echo "::error title=Worker tests failed::${msg}"
            exit 1
          fi
