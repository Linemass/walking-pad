name: release
# Push a tag like v0.6.0 -> GitHub builds WalkingPad.exe on Windows and attaches it to a Release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Engine rules
        run: python -P design/test_engine.py
      - name: Build WalkingPad.exe
        run: python -P tools/build_exe.py
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WalkingPad.exe
          body_path: RELEASE_NOTES.md
